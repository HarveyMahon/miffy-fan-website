name: Fetch images

# Downloads the Wikimedia Commons photos listed in items.json into images/
# and commits any new ones. Runs when items.json changes, or manually from
# the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
    paths: [items.json, get-images.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download images
        run: python get-images.py

      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Add downloaded images"
            git push
          fi
